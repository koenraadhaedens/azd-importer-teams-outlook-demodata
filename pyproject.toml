[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "azd-m365-demo-loader"
version = "0.1.0"
description = "Guarded Microsoft 365 CDX demo scenario loader"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.22,<1",
  "pydantic-settings>=2.11,<3",
  "pyyaml>=6.0.3,<7",
  "jsonschema>=4.25,<5",
  "httpx>=0.28,<1",
  "msal>=1.34,<2",
  "azure-identity>=1.25,<2",
  "azure-storage-blob>=12.27,<13",
  "nh3>=0.3.2,<1",
  "email-validator>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.25",
  "bandit[toml]>=1.8,<2",
  "pip-audit>=2.9,<3",
]

[project.scripts]
validate-scenario = "demo_loader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_loader"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
